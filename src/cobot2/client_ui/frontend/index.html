<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROKEY</title>
<style>
@font-face {
  font-family: 'DM Sans';
  font-style: normal;
  font-weight: 300;
  font-display: swap;
  src: url('fonts/DMSans-300.ttf') format('truetype');
}
@font-face {
  font-family: 'DM Sans';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('fonts/DMSans-400.ttf') format('truetype');
}
@font-face {
  font-family: 'DM Sans';
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: url('fonts/DMSans-500.ttf') format('truetype');
}
@font-face {
  font-family: 'Playfair Display';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('fonts/PlayfairDisplay-400.ttf') format('truetype');
}
@font-face {
  font-family: 'Playfair Display';
  font-style: normal;
  font-weight: 600;
  font-display: swap;
  src: url('fonts/PlayfairDisplay-600.ttf') format('truetype');
}
@font-face {
  font-family: 'Playfair Display';
  font-style: italic;
  font-weight: 400;
  font-display: swap;
  src: url('fonts/PlayfairDisplay-400i.ttf') format('truetype');
}
</style>
<style>
:root {
  --bg:          #0f0804;
  --surface:     rgba(38, 20, 8, 0.88);
  --border:      rgba(200, 110, 30, 0.2);
  --text:        #f2e0c4;
  --text-mid:    #c09060;
  --text-lo:     #7a5535;

  --fire:   #ff8020;
  --ember:  #ff4810;
  --gold:   #ffc030;
  --rose:   #e04828;
  --sage:   #70b880;
  --pearl:  #483020;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100vh; overflow: hidden; user-select: none; -webkit-font-smoothing: antialiased; }

body {
  background: var(--bg);
  font-family: 'DM Sans', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* ── BACKGROUND GRADIENT ─── */
.bg-layer {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 75% 65% at 50% 45%, rgba(180, 80, 10, 0.13) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 25% 75%, rgba(140, 50, 5, 0.08) 0%, transparent 55%),
    radial-gradient(ellipse 40% 50% at 80% 20%, rgba(100, 40, 5, 0.06) 0%, transparent 50%);
}

/* ── EMBER CANVAS ─── */
canvas#embers { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

/* ── SCENE ─── */
.scene {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center;
  width: 100%; max-width: 460px; padding: 0 28px;
}

/* ── TITLE ─── */
.title {
  font-family: 'Playfair Display', serif;
  font-size: 14px; font-weight: 400; font-style: italic;
  letter-spacing: 6px; text-transform: uppercase;
  color: var(--text-lo);
  margin-bottom: 40px; position: relative;
}
.title::after {
  content: '';
  position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
  width: 32px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--fire), transparent);
}

/* ── ORB SYSTEM ─── */
.orb-wrap {
  position: relative; width: 260px; height: 260px; margin-bottom: 32px;
}

/* outer glow ring */
.orb-halo {
  position: absolute; inset: -28px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,128,32,0.14) 0%, transparent 60%);
  filter: blur(20px);
  transition: background 0.9s; animation: halo-breathe 5s ease-in-out infinite;
}
@keyframes halo-breathe {
  0%,100% { transform: scale(1); opacity: 0.75; }
  50%      { transform: scale(1.12); opacity: 1; }
}

/* orb body */
.orb {
  position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle at 40% 32%,
    rgba(255, 210, 120, 0.92) 0%,
    rgba(255, 140, 30, 0.7)   28%,
    rgba(200, 70, 10, 0.35)   55%,
    rgba(15, 8, 3, 0.95)      100%
  );
  border: 1px solid rgba(220, 120, 40, 0.35);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  overflow: hidden;
  transition: border-color 0.8s, background 1s, box-shadow 0.8s;
  box-shadow:
    0 0 60px rgba(220, 110, 20, 0.25),
    0 8px 40px rgba(160, 60, 5, 0.3),
    inset 0 1px 0 rgba(255, 230, 160, 0.25),
    inset 0 0 60px rgba(200, 90, 10, 0.08);
}

/* specular */
.orb::before {
  content: '';
  position: absolute; width: 42%; height: 28%; top: 12%; left: 15%; border-radius: 50%;
  background: radial-gradient(ellipse, rgba(255,248,220,0.45) 0%, transparent 100%);
  pointer-events: none;
}

/* shimmer for processing */
.shimmer {
  position: absolute; inset: 10px; border-radius: 50%;
  border: 1.5px solid transparent;
  border-top-color: rgba(255, 200, 60, 0.7);
  border-right-color: rgba(255, 200, 60, 0.2);
  opacity: 0; pointer-events: none; transition: opacity 0.4s;
}
.shimmer.active { opacity: 1; animation: spin-cw 1.8s linear infinite; }

.shimmer2 {
  position: absolute; inset: 22px; border-radius: 50%;
  border: 1px solid transparent;
  border-bottom-color: rgba(255, 120, 20, 0.5);
  opacity: 0; pointer-events: none; transition: opacity 0.4s;
}
.shimmer2.active { opacity: 0.6; animation: spin-ccw 2.8s linear infinite; }

@keyframes spin-cw  { to { transform: rotate(360deg); } }
@keyframes spin-ccw { to { transform: rotate(-360deg); } }

/* orb inner text */
.orb-icon {
  font-size: 30px; line-height: 1;
  color: rgba(255, 220, 140, 0.9);
  transition: color 0.6s; text-shadow: 0 0 20px currentColor;
}
.orb-label {
  font-family: 'DM Sans', sans-serif;
  font-size: 10px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase;
  color: rgba(220, 160, 80, 0.65); transition: color 0.6s;
}

/* waveform */
.waveform { display: none; gap: 5px; align-items: flex-end; height: 38px; }
.waveform.active { display: flex; }
.wave-bar {
  width: 4px; background: var(--fire); border-radius: 3px; min-height: 4px; opacity: 0.8;
  animation: wave-dance 0.9s ease-in-out infinite;
}
.wave-bar:nth-child(1) { animation-duration: 0.65s; animation-delay: 0.00s; }
.wave-bar:nth-child(2) { animation-duration: 0.85s; animation-delay: 0.10s; }
.wave-bar:nth-child(3) { animation-duration: 0.70s; animation-delay: 0.20s; }
.wave-bar:nth-child(4) { animation-duration: 0.90s; animation-delay: 0.05s; }
.wave-bar:nth-child(5) { animation-duration: 0.75s; animation-delay: 0.15s; }
.wave-bar:nth-child(6) { animation-duration: 0.80s; animation-delay: 0.08s; }
.wave-bar:nth-child(7) { animation-duration: 0.68s; animation-delay: 0.18s; }
@keyframes wave-dance { 0%,100%{height:4px;} 50%{height:34px;} }

/* ── STATE VARIANTS ─── */
.orb.state-listening {
  background: radial-gradient(circle at 40% 32%,
    rgba(255,200,110,0.88) 0%, rgba(240,130,25,0.65) 28%,
    rgba(190,65,10,0.3) 55%, rgba(15,8,3,0.95) 100%);
  border-color: rgba(220,120,35,0.32);
  animation: orb-breathe 5s ease-in-out infinite;
}
@keyframes orb-breathe {
  0%,100% { box-shadow: 0 0 50px rgba(200,90,15,0.2), 0 8px 36px rgba(150,55,5,0.25), inset 0 1px 0 rgba(255,230,160,0.2); }
  50%      { box-shadow: 0 0 80px rgba(220,100,15,0.35),0 10px 50px rgba(170,65,5,0.35),inset 0 1px 0 rgba(255,230,160,0.28); }
}

.orb.state-wakeup {
  background: radial-gradient(circle at 40% 32%,
    rgba(255,220,140,0.95) 0%, rgba(255,160,30,0.75) 25%,
    rgba(230,80,10,0.4)   55%, rgba(15,8,3,0.95) 100%);
  border-color: rgba(240,140,30,0.6);
  animation: orb-wakeup 0.65s ease-in-out infinite;
}
@keyframes orb-wakeup {
  0%,100% { box-shadow: 0 0 80px rgba(240,130,20,0.45), 0 10px 60px rgba(200,70,5,0.4), inset 0 1px 0 rgba(255,240,180,0.35); }
  50%      { box-shadow: 0 0 120px rgba(255,150,20,0.65),0 14px 80px rgba(220,80,5,0.55),inset 0 1px 0 rgba(255,240,180,0.45); transform: scale(1.04); }
}

.orb.state-processing {
  background: radial-gradient(circle at 40% 32%,
    rgba(255,235,160,0.92) 0%, rgba(255,195,50,0.65) 28%,
    rgba(200,140,10,0.28) 55%, rgba(15,8,3,0.95) 100%);
  border-color: rgba(220,170,40,0.45);
  animation: orb-gold 2.5s ease-in-out infinite;
}
@keyframes orb-gold {
  0%,100% { box-shadow: 0 0 60px rgba(210,160,30,0.28),0 8px 44px rgba(160,110,5,0.3); }
  50%      { box-shadow: 0 0 90px rgba(230,175,35,0.45),0 12px 60px rgba(180,120,5,0.4); }
}

.orb.state-executing {
  background: radial-gradient(circle at 40% 32%,
    rgba(200,240,190,0.85) 0%, rgba(120,200,140,0.55) 30%,
    rgba(60,150,90,0.2)   58%, rgba(15,8,3,0.95) 100%);
  border-color: rgba(90,180,120,0.4);
  animation: orb-sage 2s ease-in-out infinite;
}
@keyframes orb-sage {
  0%,100% { box-shadow: 0 0 55px rgba(70,170,105,0.22),0 8px 40px rgba(40,130,70,0.28); }
  50%      { box-shadow: 0 0 85px rgba(80,185,115,0.38),0 12px 55px rgba(50,145,80,0.4); }
}

.orb.state-done {
  background: radial-gradient(circle at 40% 32%,
    rgba(195,235,185,0.8) 0%, rgba(110,190,135,0.5) 32%,
    rgba(55,145,85,0.18) 58%, rgba(15,8,3,0.95) 100%);
  border-color: rgba(85,170,115,0.3);
  box-shadow: 0 0 50px rgba(65,160,100,0.18), 0 8px 36px rgba(40,120,65,0.24);
}

.orb.state-error {
  background: radial-gradient(circle at 40% 32%,
    rgba(255,200,180,0.88) 0%, rgba(230,100,60,0.6) 28%,
    rgba(180,40,15,0.3)   55%, rgba(15,8,3,0.95) 100%);
  border-color: rgba(210,80,40,0.5);
  animation: orb-error 0.45s ease-in-out infinite;
}
@keyframes orb-error {
  0%,100% { transform: translateX(0); }
  25%      { transform: translateX(-3px); }
  75%      { transform: translateX(3px); }
}

.orb.state-idle {
  background: radial-gradient(circle at 40% 32%,
    rgba(80,45,20,0.6) 0%, rgba(40,22,8,0.8) 55%, rgba(15,8,3,0.97) 100%);
  border-color: rgba(120,70,25,0.15);
  box-shadow: 0 0 20px rgba(100,50,10,0.08), 0 6px 20px rgba(80,35,5,0.12);
}

/* ── CONFIDENCE ─── */
.conf-section {
  display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 28px;
}
.conf-row { display: flex; align-items: baseline; gap: 8px; }
.conf-number {
  font-family: 'Playfair Display', serif;
  font-size: 62px; font-weight: 600; line-height: 1; letter-spacing: -2px;
  font-variant-numeric: tabular-nums;
  color: var(--fire);
  text-shadow: 0 0 40px rgba(255,120,20,0.5), 0 0 80px rgba(200,70,5,0.25);
  transition: color 0.6s, text-shadow 0.6s;
}
.conf-unit {
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 300;
  color: var(--text-lo); letter-spacing: 1px;
  align-self: flex-end; padding-bottom: 9px;
}
.wake-word-tag {
  font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 400;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--text-lo); border: 1px solid var(--border);
  padding: 3px 14px; border-radius: 20px;
  transition: color 0.5s, border-color 0.5s;
}

/* ── BOTTOM PANEL ─── */
.panel {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px 22px 16px;
  position: relative; margin-bottom: 14px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.35);
  backdrop-filter: blur(8px);
}
.panel::before {
  content: ''; position: absolute;
  top: 0; left: 20px; right: 20px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(220,130,40,0.4) 30%, rgba(240,165,60,0.6) 50%, rgba(220,130,40,0.4) 70%, transparent);
  border-radius: 1px;
}
.panel-label {
  font-family: 'DM Sans', sans-serif; font-size: 9px; font-weight: 500;
  letter-spacing: 3px; text-transform: uppercase; color: var(--text-lo); margin-bottom: 10px;
}
.stt-text {
  font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 400;
  color: var(--text); line-height: 1.6; min-height: 26px;
  transition: color 0.4s; word-break: break-word;
}
.stt-text.placeholder { color: var(--text-lo); font-style: italic; font-size: 15px; }
.stt-cursor {
  display: inline-block; width: 2px; height: 15px; background: var(--fire);
  margin-left: 3px; vertical-align: middle;
  animation: cursor-blink 1s step-end infinite; opacity: 0; transition: opacity 0.3s; border-radius: 1px;
}
.stt-cursor.visible { opacity: 1; }
@keyframes cursor-blink { 0%,100%{opacity:1;} 50%{opacity:0;} }

/* ── STATUS ROW ─── */
.status-row {
  display: flex; align-items: center; justify-content: center; gap: 9px; min-height: 22px;
}
.status-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--fire);
  flex-shrink: 0; transition: background 0.5s, box-shadow 0.5s;
  animation: dot-breathe 3s ease-in-out infinite;
}
@keyframes dot-breathe { 0%,100%{opacity:0.55;} 50%{opacity:1;} }
.status-text {
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 300;
  letter-spacing: 0.2px; color: var(--text-mid); transition: color 0.4s;
}
.status-text.urgent  { color: var(--rose); }
.status-text.success { color: var(--sage); }
.status-text.active  { color: var(--fire); }

/* ── WS INDICATOR ─── */
.ws-indicator {
  position: fixed; top: 20px; right: 22px; display: flex; align-items: center; gap: 7px; z-index: 10;
}
.ws-dot {
  width: 7px; height: 7px; border-radius: 50%; background: rgba(120,70,25,0.5);
  transition: background 0.4s, box-shadow 0.4s;
}
.ws-dot.connected  { background: var(--sage);  box-shadow: 0 0 8px rgba(100,185,125,0.5); animation: ws-pulse 2.5s ease-in-out infinite; }
.ws-dot.connecting { background: var(--gold);  box-shadow: 0 0 8px rgba(240,192,50,0.4);  animation: ws-blink 0.9s ease-in-out infinite; }
.ws-dot.error      { background: var(--rose);  box-shadow: 0 0 8px rgba(220,72,40,0.5); }
@keyframes ws-pulse { 0%,100%{box-shadow:0 0 6px rgba(100,185,125,0.4);} 50%{box-shadow:0 0 12px rgba(100,185,125,0.7);} }
@keyframes ws-blink { 0%,100%{opacity:1;} 50%{opacity:0.2;} }
.ws-label {
  font-family: 'DM Sans', sans-serif; font-size: 9px; font-weight: 500;
  letter-spacing: 2px; text-transform: uppercase; color: var(--text-lo); transition: color 0.4s;
}

/* ── WAKE FLASH ─── */
.wake-flash {
  position: fixed; inset: 0; pointer-events: none; z-index: 20; opacity: 0;
  background: radial-gradient(ellipse 80% 80% at 50% 50%, rgba(255,150,40,0.1) 0%, transparent 70%);
  transition: opacity 0.1s;
}
.wake-flash.active { opacity: 1; }
</style>
</head>
<body>

<div class="bg-layer"></div>
<canvas id="embers"></canvas>
<div class="wake-flash" id="wakeFlash"></div>

<div class="ws-indicator">
  <div class="ws-dot" id="wsDot"></div>
  <div class="ws-label" id="wsLabel">OFFLINE</div>
</div>

<div class="scene">
  <div class="title">Rokey</div>

  <div class="orb-wrap">
    <div class="orb-halo" id="orbHalo"></div>
    <div class="orb state-listening" id="orb">
      <div class="shimmer"  id="shimmer"></div>
      <div class="shimmer2" id="shimmer2"></div>
      <div class="waveform" id="waveform">
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
      <div class="orb-icon"  id="orbIcon">◎</div>
      <div class="orb-label" id="orbLabel">듣는 중</div>
    </div>
  </div>

  <div class="conf-section">
    <div class="conf-row">
      <div class="conf-number" id="confNumber">0.00</div>
      <div class="conf-unit">conf</div>
    </div>
    <div class="wake-word-tag" id="wakeWordTag">hello rokey</div>
  </div>

  <div class="panel">
    <div class="panel-label">인식된 명령</div>
    <div id="sttContainer">
      <span class="stt-text placeholder" id="sttText">명령을 기다리는 중...</span>
      <span class="stt-cursor" id="sttCursor"></span>
    </div>
  </div>

  <div class="status-row">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-text" id="statusText">명령을 듣고 있습니다</div>
  </div>
</div>

<script>
'use strict';

/* ── EMBER PARTICLES ─── */
(function initEmbers() {
  const canvas = document.getElementById('embers');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function spawnEmber() {
    const x = W * 0.3 + Math.random() * W * 0.4;
    return {
      x, y: H * 0.55 + Math.random() * H * 0.15,
      vx: (Math.random() - 0.5) * 0.6,
      vy: -(0.4 + Math.random() * 0.8),
      r: 0.8 + Math.random() * 1.4,
      life: 1.0,
      decay: 0.004 + Math.random() * 0.006,
      hue: 20 + Math.random() * 30,
    };
  }

  resize(); /* W·H 먼저 초기화 */
  for (let i = 0; i < 40; i++) {
    const e = spawnEmber();
    e.y = Math.random() * H;
    e.life = Math.random();
    particles.push(e);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    if (Math.random() < 0.25) particles.push(spawnEmber());

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x  += p.vx + Math.sin(p.y * 0.015) * 0.3;
      p.y  += p.vy;
      p.life -= p.decay;
      if (p.life <= 0 || p.y < -10) { particles.splice(i, 1); continue; }

      const alpha = p.life * 0.7;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue}, 90%, 65%, ${alpha})`;
      ctx.fill();

      /* soft glow */
      if (!isFinite(p.x) || !isFinite(p.y)) { particles.splice(i, 1); continue; }
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3.5);
      g.addColorStop(0, `hsla(${p.hue}, 90%, 70%, ${alpha * 0.35})`);
      g.addColorStop(1, 'transparent');
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 3.5, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  draw();
})();

/* ── STATE CONFIG ─── */
const STATE_CONFIG = {
  LISTENING: {
    cls: 'state-listening', icon: '◎', label: '듣는 중',
    iconColor: 'rgba(255,215,130,0.9)',
    halo: 'radial-gradient(circle, rgba(240,128,32,0.16) 0%, transparent 62%)',
    confColor: 'var(--fire)',
    statusText: '명령을 듣고 있습니다', statusCls: 'active',
    dotColor: 'var(--fire)', spin: false, waveform: false,
  },
  WAKEUP_DETECTED: {
    cls: 'state-wakeup', icon: '●', label: '감지됨',
    iconColor: 'rgba(255,200,80,0.95)',
    halo: 'radial-gradient(circle, rgba(255,148,30,0.28) 0%, transparent 62%)',
    confColor: 'var(--gold)',
    statusText: '웨이크업 감지됨', statusCls: 'active',
    dotColor: 'var(--gold)', spin: false, waveform: false,
  },
  RECORDING: {
    cls: 'state-listening', icon: '', label: '',
    iconColor: 'rgba(255,215,130,0.9)',
    halo: 'radial-gradient(circle, rgba(240,128,32,0.2) 0%, transparent 62%)',
    confColor: 'var(--fire)',
    statusText: '명령을 녹음 중입니다', statusCls: 'active',
    dotColor: 'var(--fire)', spin: false, waveform: true,
  },
  PROCESSING: {
    cls: 'state-processing', icon: '⬡', label: '처리 중',
    iconColor: 'rgba(255,225,100,0.95)',
    halo: 'radial-gradient(circle, rgba(255,195,50,0.22) 0%, transparent 62%)',
    confColor: 'var(--gold)',
    statusText: '명령을 처리 중입니다...', statusCls: 'active',
    dotColor: 'var(--gold)', spin: true, waveform: false,
  },
  EXECUTING: {
    cls: 'state-executing', icon: '▶', label: '실행 중',
    iconColor: 'rgba(140,210,160,0.95)',
    halo: 'radial-gradient(circle, rgba(100,190,135,0.2) 0%, transparent 62%)',
    confColor: 'var(--sage)',
    statusText: '작업을 수행 중입니다', statusCls: 'success',
    dotColor: 'var(--sage)', spin: false, waveform: false,
  },
  DONE: {
    cls: 'state-done', icon: '✓', label: '완료',
    iconColor: 'rgba(130,200,155,0.95)',
    halo: 'radial-gradient(circle, rgba(90,175,120,0.16) 0%, transparent 62%)',
    confColor: 'var(--sage)',
    statusText: '작업이 완료되었습니다', statusCls: 'success',
    dotColor: 'var(--sage)', spin: false, waveform: false,
  },
  FAILED: {
    cls: 'state-error', icon: '✕', label: '오류',
    iconColor: 'rgba(255,180,150,0.95)',
    halo: 'radial-gradient(circle, rgba(210,80,40,0.2) 0%, transparent 62%)',
    confColor: 'var(--rose)',
    statusText: '오류가 발생했습니다', statusCls: 'urgent',
    dotColor: 'var(--rose)', spin: false, waveform: false,
  },
  IDLE: {
    cls: 'state-idle', icon: '◌', label: '대기',
    iconColor: 'rgba(120,75,35,0.6)',
    halo: 'radial-gradient(circle, rgba(100,55,15,0.08) 0%, transparent 62%)',
    confColor: 'var(--pearl)',
    statusText: '대기 중입니다', statusCls: '',
    dotColor: 'var(--pearl)', spin: false, waveform: false,
  },
  RECOVERING_RETRY:  { cls:'state-processing', icon:'↺', label:'재시도', iconColor:'rgba(255,215,90,0.9)', halo:'radial-gradient(circle, rgba(255,180,40,0.2) 0%, transparent 62%)', confColor:'var(--gold)', statusText:'재시도 중입니다', statusCls:'active', dotColor:'var(--gold)', spin:true, waveform:false },
  RECOVERING_RESET:  { cls:'state-processing', icon:'↺', label:'초기화', iconColor:'rgba(255,215,90,0.9)', halo:'radial-gradient(circle, rgba(255,180,40,0.2) 0%, transparent 62%)', confColor:'var(--gold)', statusText:'초기화 중입니다', statusCls:'active', dotColor:'var(--gold)', spin:true, waveform:false },

  ADMIN_INTERVENTION:{ cls:'state-error', icon:'⚠', label:'중단', iconColor:'rgba(255,180,150,0.95)', halo:'radial-gradient(circle, rgba(210,80,40,0.2) 0%, transparent 62%)', confColor:'var(--rose)', statusText:'관리자 확인이 필요합니다', statusCls:'urgent', dotColor:'var(--rose)', spin:false, waveform:false },
};

/* ── DOM REFS ─── */
const orb        = document.getElementById('orb');
const orbHalo    = document.getElementById('orbHalo');
const orbIcon    = document.getElementById('orbIcon');
const orbLabel   = document.getElementById('orbLabel');
const shimmer    = document.getElementById('shimmer');
const shimmer2   = document.getElementById('shimmer2');
const waveform   = document.getElementById('waveform');
const confNumber = document.getElementById('confNumber');
const wakeWordTag= document.getElementById('wakeWordTag');
const sttText    = document.getElementById('sttText');
const sttCursor  = document.getElementById('sttCursor');
const statusDot  = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const wsDot      = document.getElementById('wsDot');
const wsLabel    = document.getElementById('wsLabel');
const wakeFlash  = document.getElementById('wakeFlash');

let currentState = 'LISTENING';
let sttCursorTimer = null;

function applyState(key) {
  const cfg = STATE_CONFIG[key] || STATE_CONFIG.LISTENING;
  currentState = key;
  orb.className = 'orb ' + cfg.cls;
  orbHalo.style.background = cfg.halo;
  if (cfg.waveform) {
    orbIcon.style.display  = 'none';
    orbLabel.style.display = 'none';
    waveform.classList.add('active');
  } else {
    orbIcon.style.display  = 'block';
    orbLabel.style.display = 'block';
    waveform.classList.remove('active');
    orbIcon.textContent  = cfg.icon;
    orbLabel.textContent = cfg.label;
    orbIcon.style.color  = cfg.iconColor;
    orbIcon.style.textShadow = '0 0 20px ' + cfg.iconColor;
  }
  shimmer.className  = 'shimmer'  + (cfg.spin ? ' active' : '');
  shimmer2.className = 'shimmer2' + (cfg.spin ? ' active' : '');
  confNumber.style.color = cfg.confColor;
  statusText.textContent = cfg.statusText;
  statusText.className   = 'status-text ' + cfg.statusCls;
  statusDot.style.background = cfg.dotColor;
  if (key === 'WAKEUP_DETECTED') triggerWakeFlash();
  if (key === 'DONE' || key === 'WAKEUP_DETECTED') {
    setTimeout(() => { if (currentState === key) applyState('LISTENING'); }, 5000);
  }
}

function updateConfidence(confidence, wakeWord, detected) {
  const pct = Math.min(Math.max(confidence || 0, 0), 1);
  confNumber.textContent = pct.toFixed(2);
  if (wakeWord) wakeWordTag.textContent = wakeWord.toLowerCase();
  if (detected) {
    wakeWordTag.style.color       = 'var(--gold)';
    wakeWordTag.style.borderColor = 'rgba(240,180,40,0.45)';
  } else {
    wakeWordTag.style.color       = '';
    wakeWordTag.style.borderColor = '';
  }
}

function updateStt(text) {
  if (!text) return;
  sttText.textContent = text;
  sttText.className   = 'stt-text';
  sttCursor.classList.add('visible');
  if (sttCursorTimer) clearTimeout(sttCursorTimer);
  sttCursorTimer = setTimeout(() => sttCursor.classList.remove('visible'), 3000);
}

function triggerWakeFlash() {
  wakeFlash.classList.add('active');
  setTimeout(() => wakeFlash.classList.remove('active'), 350);
}

function setWsState(state) {
  wsDot.className = 'ws-dot ' + state;
  const labels = { connected:'ONLINE', connecting:'CONN...', error:'ERROR', '':'OFFLINE' };
  wsLabel.textContent = labels[state] || 'OFFLINE';
}

/* ── WEBSOCKET ─── */
const WS_URL = `ws://${location.hostname}:8001/ws/client`;
let ws = null, reconnectTimer = null;

function connectWs() {
  setWsState('connecting');
  ws = new WebSocket(WS_URL);
  ws.addEventListener('open', () => {
    clearInterval(reconnectTimer); reconnectTimer = null;
    setWsState('connected'); applyState('LISTENING');
  });
  ws.addEventListener('message', evt => {
    let data; try { data = JSON.parse(evt.data); } catch(_){ return; }
    handleMessage(data);
  });
  ws.addEventListener('close', () => {
    setWsState('error');
    if (!reconnectTimer) reconnectTimer = setInterval(connectWs, 3000);
  });
  ws.addEventListener('error', () => ws.close());
}

function handleMessage(data) {
  switch (data.type) {
    case 'wakeup':
      updateConfidence(data.confidence, data.wake_word, data.detected);
      if (data.detected) applyState('WAKEUP_DETECTED');
      break;
    case 'stt_result':
      updateStt(data.text); applyState('PROCESSING');
      break;
    case 'robot_status':
      applyState(data.state || 'IDLE');
      if (data.message) statusText.textContent = data.message;
      break;
  }
}

applyState('LISTENING');
updateConfidence(0, 'hello rokey', false);
connectWs();
</script>
