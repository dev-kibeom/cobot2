version: '3.8'

services:
  vision_ai:
    build: .
    container_name: yolo_vision_node
    # 🚨 가장 중요한 옵션: 호스트(Ubuntu)의 ROS 2 통신망을 그대로 공유
    network_mode: "host" 
    environment:
      - ROS_DOMAIN_ID=86  # 팀원분과 맞춘 도메인 아이디로 설정
    volumes:
      # 호스트의 코드를 수정하면 도커 안에도 즉시 반영되도록 마운트
      - ./src/cobot2/object_detection:/ros2_ws/src/cobot2/object_detection 
